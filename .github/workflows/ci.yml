name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workato-connector

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workato-connector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build

      - name: Test
        run: |
          if find . -name "*.test.ts" -o -name "*.spec.ts" | grep -q .; then
            npm test
          else
            echo "No test files found, skipping tests"
          fi

      - name: Package (verify VSIX builds)
        run: npx @vscode/vsce package --no-dependencies
